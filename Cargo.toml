[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "terra"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6.1.0"
authur = { git = "https://git.hydrar.de/jmarya/authur", features = [ "axum" ] }
argh = "0.1.13"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
toml = "1.0"
dirs = "7"
facet = "0.50.0-rc.5"
facet-json = "0.50.0-rc.5"
rediff = "0.50.0-rc.5"
facet-value = "0.50.0-rc.5"
rpassword = "7"
colored = "3"
which = "8"
sha2 = "0.11"
pulldown-cmark = "0.13"
zip = "8"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Rego interpreter for the policy engine. `http` is deliberately absent: a
# policy must not be able to reach the network. See docs/policy-engine.md §D4.
regorus = { version = "0.11", default-features = false, features = ["std", "arc", "regex", "glob", "semver"] }

[dev-dependencies]
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
