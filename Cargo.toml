[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "terra"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
uuid = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6.1.0"
base64 = "0.22.1"
authur = { git = "https://git.hydrar.de/jmarya/authur", features = [ "axum" ] }
argh = "0.1.13"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
toml = "0.9"
dirs = "5"
facet = "0.43"
facet-json = "0.43"
facet-diff = "0.43"
facet-value = "0.43"
rpassword = "7"
colored = "2"
which = "7"
sha2 = "0.10"
