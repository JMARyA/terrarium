services:
  terrarium:
    image: git.hydrar.de/jmarya/terrarium:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app
      # Optional: pre-warm selected providers (not required for normal use;
      # the network mirror fetches providers lazily on demand).
      # Place mirrors.json next to this file and uncomment:
      # - ./mirrors.json:/app/mirrors.json:ro
    environment:
      - "RUST_LOG=info"
      - "TERRARIUM_DATA=/app"
      # Refresh optional pre-warmed providers every N seconds.
      # 86400 = daily, 3600 = hourly
      # - "TERRARIUM_MIRROR_INTERVAL=86400"
      # Lazy mirror upstream allow-list. Defaults to both registries below.
      # - "TERRARIUM_UPSTREAM_REGISTRIES=registry.terraform.io,registry.opentofu.org"
      # Optional Prometheus metrics endpoint. Requires a dedicated bearer token.
      # - "TERRARIUM_METRICS=1"
      # - "TERRARIUM_METRICS_TOKEN_FILE=/run/secrets/terrarium_metrics_token"
    command: "/bin/terra serve"
